-- Crysis VR (WinlatorXR / Meta Quest) tuned settings -- appended to system.cfg by install.cmd
-- The VR mod keeps the game window borderless at the X screen size itself; these only set the
-- starting resolution/window mode and the performance-related VR mod options.
r_Fullscreen = 0
r_Width = 1592
r_Height = 1440
r_VSync = 0
r_FSAA = 0
r_MotionBlur = 0
r_DepthOfField = 0
sys_spec = 1
vr_winlatorxr_aer = 1
vr_winlatorxr_render_height = 0
vr_winlatorxr_max_fps = 0
vr_winlatorxr_block_desktop_input = 1
vr_winlatorxr_native_menu_pointer = 1
vr_seated_mode = 1
vr_height_offset = 0.0
vr_turn_mode = 1
vr_welcome_message = 0
