-- Crysis VR on Meta Quest (WinlatorXR): performance settings
--
-- The VR mod applies this file itself when the game starts and every time you return to the
-- game from a menu or loading screen, so these values win over the in-game graphics options and
-- the player profile. Lines are applied from top to bottom; "--" starts a comment.
-- To go back to the in-game options, delete this file (or comment out the lines).

-- per-eye render height; width follows the headset FOV. 0 = the full X screen height
-- (1440 with the 1592x1440 screen, full sharpness). Set e.g. 1080 for more fps, at the cost of a
-- blurrier image.
vr_winlatorxr_render_height = 0
vr_winlatorxr_aer = 1

-- quality groups on Low (1), except textures. Low shadows means no shadows.
-- Textures stay on High (3): Low swaps in low-resolution textures, which makes the whole image look
-- blurry, and texture quality costs memory rather than frame rate. (Needs a game restart to change.)
sys_spec_ObjectDetail = 1
sys_spec_Shading = 1
sys_spec_Shadows = 1
sys_spec_Texture = 3
sys_spec_Physics = 1
sys_spec_Particles = 1
sys_spec_Water = 1
sys_spec_PostProcessing = 1
sys_spec_VolumetricEffects = 1
sys_spec_GameEffects = 1

-- keep textures sharp despite the Low shading group (which picks the blurriest filtering and
-- removes detail textures)
r_TexturesFilteringQuality = 0      -- 0 = highest texture filtering [Low: 2]
r_DetailTextures = 1                -- close-up detail textures [Low: 0]
r_DetailNumLayers = 1
r_DetailDistance = 4

-- shorter view distances (Low spec defaults in brackets)
e_view_dist_ratio = 30              -- objects [40]
e_view_dist_ratio_detail = 10       -- small detail objects [15]
e_view_dist_ratio_vegetation = 10   -- trees and bushes [15]
e_vegetation_sprites_distance_ratio = 0.8  -- switch vegetation to flat sprites earlier [1]
e_lod_ratio = 2                     -- switch to simpler models earlier [3]
e_max_view_dst_spec_lerp = 0        -- use the level designers' low-spec far distance

-- far clipping plane in metres (-1 = level default). Cuts off distant terrain; uncomment to try.
-- e_max_view_dst = 800
